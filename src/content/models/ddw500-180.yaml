i18n:
  pt:
    name: Perfuratriz direcional DDW500/180
    summary: 5.000 kN de empuxo e tração e 180.000 N·m de torque, para os maiores projetos de perfuração direcional.
    description: 'A DDW500/180 foi feita para obras de grande porte: 5.000 kN de empuxo e tração e 180.000 N·m de torque, com dois motores Cummins de 410 kW. A sala de operação e a unidade de potência ficam separadas da máquina, o que dá ao operador espaço para controlar e fazer a manutenção do equipamento. As morsas triplas deslizam no mastro e aplicam até 360.000 N·m de desaperto. O guindaste embarcado de 5 t, o carregador de hastes e a passarela de manutenção completam o conjunto.'
  es:
    name: Perforadora direccional DDW500/180
    summary: 5.000 kN de empuje y tiro y 180.000 N·m de torque, para los proyectos de perforación direccional más grandes.
    description: 'La DDW500/180 está hecha para obras de gran porte: 5.000 kN de empuje y tiro y 180.000 N·m de torque, con dos motores Cummins de 410 kW. La sala de operación y la unidad de potencia están separadas de la máquina, lo que le da al operador espacio para controlar y mantener el equipo. Las morsas triples se deslizan sobre el mástil y aplican hasta 360.000 N·m de desenrosque. La grúa incorporada de 5 t, el cargador de barras y la pasarela de mantenimiento completan el conjunto.'
