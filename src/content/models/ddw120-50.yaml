i18n:
  pt:
    name: Perfuratriz direcional DDW120/50
    summary: 1.200 kN de empuxo e tração e 50.000 N·m de torque, com guindaste embarcado e controle por CLP.
    description: 'A DDW120/50 é a maior das convencionais do catálogo: 1.200 kN de empuxo e tração, 50.000 N·m de torque e motor Cummins de 264 kW. O sistema de controle por CLP com autodiagnóstico e tela sensível ao toque de 10" mostra os dados da perfuração na cabine climatizada. Trabalha com hastes de 127 mm × 6 m, que o guindaste embarcado de 2 t e o carregador ajudam a manusear, e a bomba de lama embarcada entrega 950 L/min.'
  es:
    name: Perforadora direccional DDW120/50
    summary: 1.200 kN de empuje y tiro y 50.000 N·m de torque, con grúa incorporada y control por PLC.
    description: 'La DDW120/50 es la más grande de las convencionales del catálogo: 1.200 kN de empuje y tiro, 50.000 N·m de torque y motor Cummins de 264 kW. El sistema de control por PLC con autodiagnóstico y la pantalla táctil de 10" muestran los datos de la perforación en la cabina climatizada. Trabaja con barras de 127 mm × 6 m, que la grúa incorporada de 2 t y el cargador ayudan a manipular, y la bomba de lodo incorporada entrega 950 L/min.'
