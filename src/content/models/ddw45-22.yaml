i18n:
  pt:
    name: Perfuratriz direcional DDW45/22
    summary: 450 kN de empuxo e tração e 22.000 N·m de torque, com cabine giratória e chassi de esteiras para terrenos difíceis.
    description: A DDW45/22 entrega 450 kN de empuxo e tração e 22.000 N·m de torque com um motor Cummins de 179 kW. O sistema de ancoragem hidráulico dá estabilidade ao perfurar com força máxima e reduz o desgaste das roscas. O chassi de esteiras de aço com sapatas de borracha se move bem em obras com lama, e a cabine fechada gira até 90°. O carregador automático de hastes agiliza o trabalho e a bomba de lama embarcada entrega 600 L/min.
  es:
    name: Perforadora direccional DDW45/22
    summary: 450 kN de empuje y tiro y 22.000 N·m de torque, con cabina giratoria y chasis de orugas para terrenos difíciles.
    description: La DDW45/22 entrega 450 kN de empuje y tiro y 22.000 N·m de torque con un motor Cummins de 179 kW. El sistema de anclaje hidráulico da estabilidad al perforar con la fuerza máxima y reduce el desgaste de las roscas. El chasis de orugas de acero con zapatas de goma se desplaza bien en obras con barro, y la cabina cerrada gira hasta 90°. El cargador automático de barras agiliza el trabajo y la bomba de lodo incorporada entrega 600 L/min.
