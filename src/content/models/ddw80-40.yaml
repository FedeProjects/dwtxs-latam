i18n:
  pt:
    name: Perfuratriz direcional DDW80/40
    summary: 800 kN de empuxo e tração e 40.000 N·m de torque, com controle interativo de todos os parâmetros.
    description: A DDW80/40 entrega 800 kN de empuxo e tração e 40.000 N·m de torque, com motor Cummins de 264 kW e sistema hidráulico de 42 MPa. No posto de operação, os comandos estão organizados de forma clara e todos os parâmetros de perfuração se controlam pelo sistema interativo. O chassi de esteiras se desloca bem em terrenos difíceis, as morsas chegam a 106.000 N·m de desaperto e a bomba de lama embarcada entrega 950 L/min.
  es:
    name: Perforadora direccional DDW80/40
    summary: 800 kN de empuje y tiro y 40.000 N·m de torque, con control interactivo de todos los parámetros.
    description: La DDW80/40 entrega 800 kN de empuje y tiro y 40.000 N·m de torque, con motor Cummins de 264 kW y sistema hidráulico de 42 MPa. En el puesto de operación, los mandos están ordenados con claridad y todos los parámetros de perforación se controlan desde el sistema interactivo. El chasis de orugas se desplaza bien en terrenos difíciles, las morsas llegan a 106.000 N·m de desenrosque y la bomba de lodo incorporada entrega 950 L/min.
