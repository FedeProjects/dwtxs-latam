i18n:
  pt:
    name: Perfuratriz direcional DDW36/15SE
    summary: 350 kN de empuxo e tração e até 13.000 N·m de torque, com motor Cummins de 153 kW.
    description: A DDW36/15SE é uma máquina de porte médio, com 12 t, 350 kN de empuxo e tração e cabeçote de três faixas que chega a 13.000 N·m. O motor Cummins de 153 kW e o sistema hidráulico de 38 MPa sustentam o trabalho contínuo, e as morsas aplicam até 60.000 N·m de torque de desaperto. A cabine é fechada e climatizada, o magazine leva 40 hastes de 76 mm e a bomba de lama embarcada entrega 600 L/min.
  es:
    name: Perforadora direccional DDW36/15SE
    summary: 350 kN de empuje y tiro y hasta 13.000 N·m de torque, con motor Cummins de 153 kW.
    description: La DDW36/15SE es una máquina de porte medio, con 12 t, 350 kN de empuje y tiro y un cabezal de tres rangos que llega a 13.000 N·m. El motor Cummins de 153 kW y el sistema hidráulico de 38 MPa sostienen el trabajo continuo, y las morsas aplican hasta 60.000 N·m de torque de desenrosque. La cabina es cerrada y climatizada, el cargador lleva 40 barras de 76 mm y la bomba de lodo incorporada entrega 600 L/min.
