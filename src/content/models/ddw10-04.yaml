i18n:
  pt:
    name: Perfuratriz direcional DDW10/04
    summary: A mais compacta da linha convencional, com 90 kN de empuxo e tração, 4.000 N·m de torque e esteiras de borracha.
    description: A DDW10/04 é a mais compacta das perfuratrizes convencionais do catálogo. Com 5 t e 1,7 m de largura, é fácil de transportar e de posicionar em espaços reduzidos. O motor Cummins de 64,1 kW move o cabeçote por cremalheira e pinhão, com 90 kN de empuxo e tração e 4.000 N·m de torque. Todas as funções ficam reunidas nos joysticks, o magazine leva 44 hastes com alimentação automática e a bomba de lama de 115 L/min é embarcada.
  es:
    name: Perforadora direccional DDW10/04
    summary: La más compacta de la línea convencional, con 90 kN de empuje y tiro, 4.000 N·m de torque y orugas de goma.
    description: La DDW10/04 es la más compacta de las perforadoras convencionales del catálogo. Con 5 t y 1,7 m de ancho, es fácil de transportar y de posicionar en espacios reducidos. El motor Cummins de 64,1 kW mueve el cabezal por cremallera y piñón, con 90 kN de empuje y tiro y 4.000 N·m de torque. Todas las funciones se manejan desde los joysticks, el cargador lleva 44 barras con alimentación automática y la bomba de lodo de 115 L/min viene incorporada.
