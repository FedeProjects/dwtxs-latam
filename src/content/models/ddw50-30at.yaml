reviewNotes:
  - 'El folleto PDF indica «PULL FORCE: 48 TON / TORQUE: 22000 NM», pero la ficha técnica dice 500 kN y 30.000 N·m. Se usó la ficha.'
  - 'Valores de la ficha web que no aparecen en el folleto PDF: Dimensions › Length/Width/Height: 7400*2300*2600 mm; Dimensions › Entry angle: 16-24°; Dimensions › Machine weight: 15 ton; Engine › Fuel tank capacity: 540 L; Undercarriage › Travel speed: 0-3.5 km/h, forward & reverse; Rotary drive › Rotary torque outer rod: 30000 N.M; Rotary drive › Rotary torque inner rod: 3000 N.M; Carriage › Maximum thrust/pullback force: 500 KN; Carriage › Max travel distance: 4.2 m; Wrench assembly › Max breakout torque: 50000 Nm; Drill pipe › Outer rod: Φ89*3000 mm; Drill pipe › Inner rod: Φ50*3000 mm.'
i18n:
  pt:
    name: Perfuratriz All Terrain DDW50/30AT
    summary: Haste dupla para rocha, com 500 kN de empuxo e tração e 30.000 N·m de torque na haste externa.
    description: A DDW50/30AT é uma All Terrain de porte médio para perfurar rocha com o sistema de haste dupla. Tem 500 kN de empuxo e tração, 30.000 N·m de torque na haste externa e motor Cummins de 194 kW. O guindaste embarcado de 2 t e o carregador de hastes ajudam no manuseio das hastes duplas de 89 e 50 mm, e a bomba de lama embarcada entrega 600 L/min para perfurações mais longas.
  es:
    name: Perforadora All Terrain DDW50/30AT
    summary: Doble barra para roca, con 500 kN de empuje y tiro y 30.000 N·m de torque en la barra exterior.
    description: La DDW50/30AT es una All Terrain de porte medio para perforar roca con el sistema de doble barra. Tiene 500 kN de empuje y tiro, 30.000 N·m de torque en la barra exterior y motor Cummins de 194 kW. La grúa incorporada de 2 t y el cargador de barras ayudan a manipular las barras dobles de 89 y 50 mm, y la bomba de lodo incorporada entrega 600 L/min para perforaciones más largas.
