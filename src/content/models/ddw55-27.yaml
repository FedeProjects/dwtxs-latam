i18n:
  pt:
    name: Perfuratriz direcional DDW55/27
    summary: 550 kN de empuxo e tração e 27.000 N·m de torque, um dos modelos mais vendidos da DWTXS.
    description: A DDW55/27 é um dos modelos mais vendidos da DWTXS. Tem 550 kN de empuxo e tração, 27.000 N·m de torque e motor Cummins de 194 kW, com curso de carro de 5,8 m para hastes de 4,5 m. As morsas abertas ficam inclinadas para o operador, que vê a união das hastes ao montar e desmontar a coluna. O carregador automático agiliza a troca de hastes e a vazão da bomba de lama embarcada (até 800 L/min) se ajusta a cada condição de perfuração.
  es:
    name: Perforadora direccional DDW55/27
    summary: 550 kN de empuje y tiro y 27.000 N·m de torque, uno de los modelos más vendidos de DWTXS.
    description: La DDW55/27 es uno de los modelos más vendidos de DWTXS. Tiene 550 kN de empuje y tiro, 27.000 N·m de torque y motor Cummins de 194 kW, con un recorrido de carro de 5,8 m para barras de 4,5 m. Las morsas abiertas están inclinadas hacia el operador, que ve la unión de las barras al armar y desarmar la columna. El cargador automático agiliza el cambio de barras y el caudal de la bomba de lodo incorporada (hasta 800 L/min) se ajusta a cada condición de perforación.
