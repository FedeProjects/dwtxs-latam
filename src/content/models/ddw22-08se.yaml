i18n:
  pt:
    name: Perfuratriz direcional DDW22/08SE
    summary: 200 kN de empuxo e tração, cabine fechada com ar-condicionado e cabeçote de três velocidades até 7.000 N·m.
    description: A DDW22/08SE combina um porte de 8 t com 200 kN de empuxo e tração. O cabeçote rotativo tem três faixas de torque e rotação (7.000, 4.500 e 2.500 N·m), para adaptar a máquina a cada tipo de solo. O motor Cummins de 112 kW garante potência constante para o carro e a rotação, e a cabine totalmente fechada e climatizada dá conforto ao operador em jornadas longas. O magazine leva 48 hastes e a bomba de lama embarcada entrega 300 L/min.
  es:
    name: Perforadora direccional DDW22/08SE
    summary: 200 kN de empuje y tiro, cabina cerrada con aire acondicionado y cabezal de tres velocidades de hasta 7.000 N·m.
    description: La DDW22/08SE combina un porte de 8 t con 200 kN de empuje y tiro. El cabezal rotativo tiene tres rangos de torque y velocidad (7.000, 4.500 y 2.500 N·m), para adaptar la máquina a cada tipo de suelo. El motor Cummins de 112 kW asegura potencia constante para el carro y la rotación, y la cabina totalmente cerrada y climatizada da confort al operador en jornadas largas. El cargador lleva 48 barras y la bomba de lodo incorporada entrega 300 L/min.
