i18n:
  pt:
    name: Perfuratriz All Terrain DDW75/40AT
    summary: A maior All Terrain, com 750 kN de empuxo e tração e 40.000 N·m de torque na haste externa.
    description: A DDW75/40AT é a maior All Terrain da DWTXS. O cabeçote com hastes interna e externa e rotação de variação contínua ajusta torque e velocidade para atravessar tanto solo duro quanto rocha. Tem 750 kN de empuxo e tração, 40.000 N·m de torque na haste externa e motor Cummins de 294 kW. O alojamento de sonda específico para rocha mantém o sinal correto durante toda a perfuração, e o operador controla todas as funções com dois joysticks.
  es:
    name: Perforadora All Terrain DDW75/40AT
    summary: La All Terrain más grande, con 750 kN de empuje y tiro y 40.000 N·m de torque en la barra exterior.
    description: La DDW75/40AT es la All Terrain más grande de DWTXS. El cabezal con barras interior y exterior y rotación de variación continua ajusta torque y velocidad para atravesar tanto suelo duro como roca. Tiene 750 kN de empuje y tiro, 40.000 N·m de torque en la barra exterior y motor Cummins de 294 kW. El alojamiento de sonda específico para roca mantiene la señal correcta durante toda la perforación, y el operador controla todas las funciones con dos joysticks.
