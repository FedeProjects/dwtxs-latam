i18n:
  pt:
    name: Perfuratriz All Terrain DDW20/10AT
    summary: Haste dupla para rocha, com 200 kN de empuxo e tração e 7.000 N·m de torque na haste externa.
    description: A DDW20/10AT é a All Terrain mais compacta da DWTXS. O sistema de haste dupla, com haste externa de 60 mm e interna de 25 mm, permite perfurar rocha e solos mistos com a mesma máquina. Tem 200 kN de empuxo e tração, 7.000 N·m de torque na haste externa e motor Cummins de 125 kW. O magazine, reforçado para o peso das hastes duplas, leva 40 hastes com alimentação automática, e a bomba de lama embarcada de 400 L/min permite perfurações mais longas.
  es:
    name: Perforadora All Terrain DDW20/10AT
    summary: Doble barra para roca, con 200 kN de empuje y tiro y 7.000 N·m de torque en la barra exterior.
    description: La DDW20/10AT es la All Terrain más compacta de DWTXS. El sistema de doble barra, con barra exterior de 60 mm e interior de 25 mm, permite perforar roca y suelos mixtos con la misma máquina. Tiene 200 kN de empuje y tiro, 7.000 N·m de torque en la barra exterior y motor Cummins de 125 kW. El cargador, reforzado para el peso de las barras dobles, lleva 40 barras con alimentación automática, y la bomba de lodo incorporada de 400 L/min permite perforaciones más largas.
