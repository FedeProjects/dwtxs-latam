i18n:
  pt:
    name: Perfuratriz direcional DDW240/70L
    summary: 2.400 kN de empuxo e tração e até 70.000 N·m de torque, com sala de operação separada e guindaste de 3,2 t.
    description: A DDW240/70L abre a linha Maxi-Rig com 2.400 kN de empuxo e tração e cabeçote de três faixas que chega a 70.000 N·m. O chassi de esteiras de aço tem motor próprio para deslocamentos curtos sem reboque. A ancoragem com placa larga e viga traseira ligada por cabo de aço mantém a máquina firme no tiro máximo. O carregador de hastes com ajuste de nível e o guindaste embarcado de 3,2 t garantem um manuseio seguro das hastes de 9,6 m, e o operador trabalha em uma sala separada, climatizada, com três monitores de 10".
  es:
    name: Perforadora direccional DDW240/70L
    summary: 2.400 kN de empuje y tiro y hasta 70.000 N·m de torque, con sala de operación separada y grúa de 3,2 t.
    description: La DDW240/70L abre la línea Maxi-Rig con 2.400 kN de empuje y tiro y un cabezal de tres rangos que llega a 70.000 N·m. El chasis de orugas de acero tiene motor propio para traslados cortos sin remolque. El anclaje con placa ancha y viga trasera unida por cable de acero mantiene la máquina firme en el tiro máximo. El cargador de barras con ajuste de nivel y la grúa incorporada de 3,2 t aseguran un manejo seguro de las barras de 9,6 m, y el operador trabaja en una sala separada, climatizada, con tres monitores de 10".
