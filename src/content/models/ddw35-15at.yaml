i18n:
  pt:
    name: Perfuratriz All Terrain DDW35/15AT
    summary: Haste dupla para rocha, com 350 kN de empuxo e tração e 15.000 N·m de torque na haste externa.
    description: A DDW35/15AT usa o sistema de haste dupla da DWTXS para perfurar rocha e solos mistos. Tem 350 kN de empuxo e tração, 15.000 N·m de torque na haste externa e 2.700 N·m na interna, com motor Cummins de 153 kW. As hastes externas de 89 mm e internas de 50 mm entram por alimentação automática a partir de um magazine de 32 hastes. A cabine é fechada e climatizada e a bomba de lama embarcada entrega 400 L/min.
  es:
    name: Perforadora All Terrain DDW35/15AT
    summary: Doble barra para roca, con 350 kN de empuje y tiro y 15.000 N·m de torque en la barra exterior.
    description: La DDW35/15AT usa el sistema de doble barra de DWTXS para perforar roca y suelos mixtos. Tiene 350 kN de empuje y tiro, 15.000 N·m de torque en la barra exterior y 2.700 N·m en la interior, con motor Cummins de 153 kW. Las barras exteriores de 89 mm e interiores de 50 mm entran con alimentación automática desde un cargador de 32 barras. La cabina es cerrada y climatizada y la bomba de lodo incorporada entrega 400 L/min.
