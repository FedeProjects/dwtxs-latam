i18n:
  pt:
    name: Perfuratriz direcional DDW360/130
    summary: 3.600 kN de empuxo e tração e 130.000 N·m de torque, com dois motores Cummins e unidade de potência separada.
    description: A DDW360/130 entrega 3.600 kN de empuxo e tração e 130.000 N·m de torque. A unidade de potência separada tem dois motores Cummins de 264 kW e sistema de arrefecimento próprio, para trabalhar tanto em clima desértico quanto tropical. Da sala de operação climatizada, com joysticks e três monitores, o operador acompanha todos os dados da perfuração e o movimento da máquina. Uma passarela com guarda-corpo ao longo de todo o chassi facilita a manutenção, e as conexões rápidas tornam a montagem simples e precisa.
  es:
    name: Perforadora direccional DDW360/130
    summary: 3.600 kN de empuje y tiro y 130.000 N·m de torque, con dos motores Cummins y unidad de potencia separada.
    description: La DDW360/130 entrega 3.600 kN de empuje y tiro y 130.000 N·m de torque. La unidad de potencia separada tiene dos motores Cummins de 264 kW y sistema de refrigeración propio, para trabajar tanto en clima desértico como tropical. Desde la sala de operación climatizada, con joysticks y tres monitores, el operador sigue todos los datos de la perforación y el movimiento de la máquina. Una pasarela con baranda a lo largo de todo el chasis facilita el mantenimiento, y las conexiones rápidas hacen que el montaje sea simple y preciso.
