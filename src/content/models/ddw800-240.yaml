i18n:
  pt:
    name: Perfuratriz direcional DDW800/240
    summary: 8.000 kN de empuxo e tração e 240.000 N·m de torque, o maior Maxi-Rig do catálogo.
    description: 'A DDW800/240 é o maior Maxi-Rig do catálogo: 8.000 kN de empuxo e tração e 240.000 N·m de torque. A máquina de 70 t trabalha com uma unidade de potência separada, com motores Cummins, e uma sala de operação tipo contêiner com ar-condicionado e três telas sensíveis ao toque de 10". As morsas quádruplas deslizam no mastro e chegam a 830.000 N·m de desaperto, e o guindaste de 8 t ajuda a manusear as hastes de 194 mm × 9,6 m.'
  es:
    name: Perforadora direccional DDW800/240
    summary: 8.000 kN de empuje y tiro y 240.000 N·m de torque, la Maxi-Rig más grande del catálogo.
    description: 'La DDW800/240 es la Maxi-Rig más grande del catálogo: 8.000 kN de empuje y tiro y 240.000 N·m de torque. La máquina de 70 t trabaja con una unidad de potencia separada, con motores Cummins, y una sala de operación tipo contenedor con aire acondicionado y tres pantallas táctiles de 10". Las morsas cuádruples se deslizan sobre el mástil y llegan a 830.000 N·m de desenrosque, y la grúa de 8 t ayuda a manipular las barras de 194 mm × 9,6 m.'
